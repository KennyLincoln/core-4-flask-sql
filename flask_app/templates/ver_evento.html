<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ver Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1>{{ evento.nombre_evento }}</h1>
            <p class="text-muted">Publicado por: {{ evento.organizador }}</p>
        </div>
        <div>
            <a href="/eventos" class="btn btn-link">Inicio</a>
            <a href="/logout" class="btn btn-link text-danger">Cerrar Sesión</a>
        </div>
    </div>

    <div class="card p-4 border-dark col-md-8">
        <p><strong>Ubicación:</strong> {{ evento.ubicacion }}</p>
        <p><strong>Fecha:</strong> {{ evento.fecha }}</p>
        <p><strong>Detalles:</strong> {{ evento.detalles }}</p>
    </div>
</body>
</html>
