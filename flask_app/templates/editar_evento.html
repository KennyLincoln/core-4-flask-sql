<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Editar Evento</h1>
        <div>
            <a href="/eventos" class="btn btn-link">Inicio</a>
            <a href="/logout" class="btn btn-link text-danger">Cerrar Sesión</a>
        </div>
    </div>

    {% with messages = get_flashed_messages(category_filter=['evento']) %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger py-1">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/actualizar/evento/{{ evento.id }}" method="post" class="col-md-6">
        <div class="mb-3">
            <label for="nombre_evento" class="form-label">Nombre Evento:</label>
            <input type="text" name="nombre_evento" id="nombre_evento" class="form-control" value="{{ evento.nombre_evento }}">
        </div>
        <div class="mb-3">
            <label for="ubicacion" class="form-label">Ubicación:</label>
            <input type="text" name="ubicacion" id="ubicacion" class="form-control" value="{{ evento.ubicacion }}">
        </div>
        <div class="mb-3">
            <label for="fecha" class="form-label">Fecha:</label>
            <input type="date" name="fecha" id="fecha" class="form-control" value="{{ evento.fecha }}">
        </div>
        <div class="mb-3">
            <label for="detalles" class="form-label">Detalles:</label>
            <textarea name="detalles" id="detalles" class="form-control" rows="4">{{ evento.detalles }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Evento</button>
    </form>
</body>
</html>
